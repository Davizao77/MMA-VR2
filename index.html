<!--
=====================================================================
HISTÓRIA E PROPOSTA DO JOGO (só referência, não muda nada no jogo)
Claude: leia isto antes de mexer em carreira, NPCs, diálogos ou fazenda.
=====================================================================

INÍCIO
Candy é um homem de idade que trabalha numa fazenda. No passado oculto
dele, ele era lutador. Davi, um rapaz alto, pede para ser treinado pelo
senhor. Candy aceita, porém lá é tudo muito cru, muito seco, não tem
tecnologia, só o silêncio, uma vibe mais raiz mesmo. Candy já estava
treinando outro jovem, Alexie, que também sonha em se tornar um lutador
famoso.

PERSONAGENS
- DAVI (protagonista): rapaz alto, 1,93 m de altura e 2,02 m de
  envergadura. Pele morena. Cabelos cacheados pretos com luzes loiras,
  presos num rabo de cavalo. Corpo mais definido e magro.
- CANDY (treinador): homem de idade, trabalha numa fazenda. Ex-lutador,
  passado oculto. Treina de forma crua, seca e silenciosa.
- ALEXIE (outro aprendiz): jovem treinado por Candy, sonha em ser um
  lutador famoso.

TOM DA FAZENDA
Cru, seco, raiz. Sem tecnologia. O silêncio faz parte do treino.

EVOLUÇÃO
A história corre ao longo do tempo. Alexie também vai melhorando,
lutando e crescendo na vida. Vão surgindo rivais nas lutas. Existem
também rivalidades entre outros lutadores que não têm nada a ver com
Davi, Alexie ou Candy: histórias próprias do mundo das lutas, em paralelo.
=====================================================================
-->

<script>
var crowdE=0,cNode=null;
const cl=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v)),rr=(a,b)=>a+Math.random()*(b-a),TAU=Math.PI*2;
let ac=null,AB=null,AENV='menu';
const aN={},rnd2=(a,b)=>a+Math.random()*(b-a),alL={};
// ================= ÁUDIO REALISTA (síntese procedural) =================
// Cadeia: sons -> bus (pan 3D opcional + envio de reverb) -> compressor/limitador -> saída. A reverb muda por ambiente (octógono / campo / academia).
function audWake(){if(ac&&ac.state!='running')ac.resume().catch(()=>{})}
let audWd=0;
function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();audBuild();ac.onstatechange=audWake;if(!audWd){audWd=setInterval(audWake,400);document.addEventListener('visibilitychange',audWake)}}catch(e){ac=null;AB=null;return}}if(ac&&ac.state=='suspended')ac.resume().catch(()=>{})}
function audBuild(){const sr=ac.sampleRate,mk=(sec,fn)=>{const b=ac.createBuffer(1,sr*sec|0,sr),d=b.getChannelData(0);fn(d,d.length);return b};
 aN.w=mk(2,(d,n)=>{for(let i=0;i<n;i++)d[i]=Math.random()*2-1});                                   // ruído branco
 aN.p=mk(4,(d,n)=>{let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}});   // ruído rosa
 aN.b=mk(4,(d,n)=>{let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}});   // ruído marrom (graves)
 aN.k=mk(.06,(d,n)=>{let lp=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;lp+=(w-lp)*.5;d[i]=(w-lp*.55)*Math.exp(-i/(sr*.0011))*(i<6?i/6:1)}});   // estalo de contato: impulso curtíssimo
 const dry=ac.createGain(),comp=ac.createDynamicsCompressor(),mst=ac.createGain(),rv=ac.createConvolver(),rvg=ac.createGain(),rvIn=ac.createGain();
 comp.threshold.value=-8;comp.knee.value=14;comp.ratio.value=2.5;comp.attack.value=.006;comp.release.value=.12;mst.gain.value=.9;comp.threshold.value=-4;comp.ratio.value=2;
 const lim=ac.createWaveShaper(),cbus=ac.createGain(),lcv=new Float32Array(2049);for(let i=0;i<2049;i++)lcv[i]=Math.tanh(1.4*(i/1024-1));lim.curve=lcv;lim.oversample='none';cbus.gain.value=.4;dry.gain.value=1.35;   // limitador por saturação suave: sem tempo de ataque/soltura, não "engole" o áudio depois de um golpe forte
 dry.connect(comp);comp.connect(mst);cbus.connect(mst);mst.connect(lim);lim.connect(ac.destination);   // torcida (cbus) NÃO passa pelo compressor: antes ela abafava os golpes e o resto do áudio
 rvIn.connect(rv);rv.connect(rvg);rvg.connect(comp);
 // reflexões iniciais (paredes do ginásio): 5 ecos curtos, escurecidos e espalhados no estéreo
 const er=ac.createGain(),erf=ac.createBiquadFilter();erf.type='lowpass';erf.frequency.value=3600;er.connect(erf);
 [[.017,.5,-.6],[.029,.38,.6],[.043,.3,-.3],[.067,.2,.4],[.097,.12,-.5]].forEach(([d,g,pn])=>{const dl=ac.createDelay(.3),gg=ac.createGain();dl.delayTime.value=d;gg.gain.value=g;erf.connect(dl);dl.connect(gg);if(ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pn;gg.connect(p);p.connect(comp)}else gg.connect(comp)});
 AB={dry,comp,mst,rv,rvg,rvIn,er,cbus,irc:{}};audEnv(AENV)}
const RVP={menu:[2.4,.9,.30],oct:[2.4,.9,.30],field:[.5,2.5,.05],farm:[.5,2.5,.05],gym:[.9,3,.22]};   // [duração s, queda, volume da reverb]
function audEnv(k){if(!ac||!AB)return;const key=k=='menu'?'oct':k,p=RVP[key]||RVP.oct;
 if(!AB.irc[key]){const sr=ac.sampleRate,n=sr*p[0]|0,b=ac.createBuffer(2,n,sr);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);let lp=0;for(let i=0;i<n;i++){const t=i/n,w=Math.random()*2-1;lp+=(w-lp)*(.9-.8*t);d[i]=lp*Math.pow(1-t,p[1])*(i<sr*.004?i/(sr*.004):1)}}   // cauda que escurece com o tempo
  AB.irc[key]=b}

function audListen(){const cam=window.AUDCAM;if(!cam||!window.THREE)return;if(!alL.f){alL.f=new THREE.Vector3();alL.u=new THREE.Vector3();alL.p=new THREE.Vector3()}const alF=alL.f,alU=alL.u,alP=alL.p,L=ac.listener;cam.getWorldPosition(alP);alF.set(0,0,-1).transformDirection(cam.matrixWorld);alU.set(0,1,0).transformDirection(cam.matrixWorld);
 if(L.positionX){L.positionX.value=alP.x;L.positionY.value=alP.y;L.positionZ.value=alP.z;L.forwardX.value=alF.x;L.forwardY.value=alF.y;L.forwardZ.value=alF.z;L.upX.value=alU.x;L.upY.value=alU.y;L.upZ.value=alU.z}
 else L.setPosition(alP.x,alP.y,alP.z),L.setOrientation(alF.x,alF.y,alF.z,alU.x,alU.y,alU.z)}
// entrada de um som: posição 3D opcional + envio de reverb
function bus(pos,send,er){const g=ac.createGain();let o=g;
 if(pos&&ac.createPanner){const p=ac.createPanner();p.panningModel='equalpower';p.distanceModel='inverse';p.refDistance=1.2;p.rolloffFactor=1.1;
  if(p.positionX){p.positionX.value=pos.x;p.positionY.value=pos.y;p.positionZ.value=pos.z}else p.setPosition(pos.x,pos.y,pos.z);g.connect(p);o=p}
 o.connect(AB.dry);const s=ac.createGain();s.gain.value=send==null?.3:send;g.connect(s);s.connect(AB.rvIn);if(er&&AB.er){const e=ac.createGain();e.gain.value=er;g.connect(e);e.connect(AB.er)}return g}
// ---- primitivas ----
// rajada de ruído filtrado (f2 = varredura do filtro)
function aN1(o,t,dur,k,typ,f,q,v,att,f2){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=aN[k||'w'];s.loop=true;fl.type=typ;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);fl.Q.value=q;
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0002,t+dur);s.connect(fl);fl.connect(g);g.connect(o);s.start(t,Math.random()*1.5);s.stop(t+dur+.05)}
// seno/triângulo com queda de tom e decaimento (usado em baques e modos de ressonância)
function aT(o,t,f0,f1,dur,v,type,att){const x=ac.createOscillator(),g=ac.createGain();x.type=type||'sine';x.frequency.setValueAtTime(f0,t);x.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(att||.003));g.gain.exponentialRampToValueAtTime(.0002,t+dur);x.connect(g);g.connect(o);x.start(t);x.stop(t+dur+.05)}
// estalo de contato: impulso pré-gravado (playbackRate muda o brilho), passa por um passa-faixa
function aClk(o,t,v,rate,f,q){const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=aN.k;s.playbackRate.value=rate;fl.type='bandpass';fl.frequency.value=f;fl.Q.value=q||.7;g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(o);s.start(t);s.stop(t+.07)}
// modo ressonante (osso, caixa torácica, couro, metal do sino): seno que "assenta" a partir de um tom um pouco mais agudo
function aMode(o,t,f,dur,v,sh){const x=ac.createOscillator(),g=ac.createGain();x.type='sine';x.frequency.setValueAtTime(f*(sh||1.05),t);x.frequency.exponentialRampToValueAtTime(f,t+Math.min(.03,dur*.4));g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.0012);g.gain.exponentialRampToValueAtTime(.0002,t+dur);x.connect(g);g.connect(o);x.start(t);x.stop(t+dur+.05)}
// voz humana: pulso glotal (serra) + sopro + 3 formantes que deslizam (FM = [[ini,fim],...]), instabilidade de tom
function aV(o,t,f0,f0e,dur,v,FM,br){
 const x=ac.createOscillator(),xg=ac.createGain(),ng=ac.createGain(),sum=ac.createGain(),env=ac.createGain(),s=ac.createBufferSource(),jt=ac.createOscillator(),jg=ac.createGain(),lp=ac.createBiquadFilter();
 x.type='sawtooth';x.frequency.setValueAtTime(f0,t);x.frequency.linearRampToValueAtTime(Math.max(40,f0*f0e),t+dur);

 xg.gain.value=(1-br)*.9;x.connect(xg);xg.connect(sum);

 FM.forEach((f,i)=>{const b=ac.createBiquadFilter(),g=ac.createGain();b.type='bandpass';b.Q.value=[7,9,11][i];b.frequency.setValueAtTime(f[0],t);b.frequency.linearRampToValueAtTime(f[1],t+dur);g.gain.value=[1,.7,.4][i]*2.5;sum.connect(b);b.connect(g);g.connect(env)});
 lp.type='lowpass';lp.frequency.value=4200;
 env.gain.setValueAtTime(.0001,t);env.gain.linearRampToValueAtTime(v,t+Math.min(.05,dur*.3));env.gain.linearRampToValueAtTime(v*.8,t+dur*.5);env.gain.exponentialRampToValueAtTime(.0002,t+dur);
 env.connect(lp);lp.connect(o);x.start(t);jt.start(t);s.start(t,Math.random()*2);x.stop(t+dur+.05);jt.stop(t+dur+.05);s.stop(t+dur+.05)}

function breathOne(o,t,v,d,inh){const s=ac.createBufferSource(),f1=ac.createBiquadFilter(),f2=ac.createBiquadFilter(),g=ac.createGain();s.buffer=aN.p;s.loop=true;

// ---- botão / UI ----
function snd(f,v){if(!ac||!AB)return;try{const t=ac.currentTime,o=bus(null,.1);aT(o,t,f*1.6,f*1.1,.05,v*.35,'triangle',.001);aN1(o,t,.02,'w','bandpass',3000,1.5,v*.25,.0005)}catch(e){}}

// ---- impactos ----
// Cada golpe = clique do contato + tapa da carne (ruído filtrado que desce) + baque grave + modos de ressonância (crânio / caixa torácica / membro) + ar da luva.
// Forte: sub grave e segundo baque do corpo balançando. Nocaute (crit): estalo, boom e estalo de mandíbula. Variação aleatória de tom em cada golpe.
let pLast=0;
const SAT=(()=>{const n=1024,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i/(n-1)*2-1;c[i]=Math.tanh(x*2.2)/Math.tanh(2.2)}return c})();   // saturação suave: dá "soco" e cola as camadas
const PK={
 // sl = estalo/tapa [freq], fl = carne [freq], lo = corpo [freq], th = baque tonal [de, até], md = modos ressonantes [freq, duração s, nível], bo = peso do corpo
 head:{sl:3000,fl:1350,lo:210,th:[165,62],md:[[310,.11,.5],[610,.07,.38],[1180,.045,.22]],bo:.55},
 body:{sl:2100,fl:880,lo:150,th:[118,44],md:[[92,.2,.55],[185,.13,.38],[330,.08,.22]],bo:.95},
 limb:{sl:3200,fl:1550,lo:240,th:[190,90],md:[[340,.07,.4],[720,.04,.2]],bo:.3},
 bag:{sl:1500,fl:560,lo:115,th:[90,42],md:[[78,.26,.55],[150,.17,.35],[260,.1,.2]],bo:1.2}};
function punchSnd(pw,kind,crit,pos){if(!ac||!AB)return;try{const t=ac.currentTime;if(t-pLast<.02)return;pLast=t;
 const p=Math.max(0,Math.min(1,pw)),r=rnd2(.92,1.08),gv=rnd2(.88,1.1),b=bus(pos,.04+.12*p+(crit?.2:0),.06+.16*p);   // 3º argumento: eco das paredes do ginásio

  aClk(b,t,v*1.1,r*1.15,2600*r,.8);aClk(b,t+.003,v*.5,r*.9,1800*r,.8);                                  // couro estalando
  aN1(b,t,.035,'w','bandpass',2000*r,1.3,v*.9,.0008);aN1(b,t,.08,'p','bandpass',820*r,1.1,v*1.1,.001,420);   // "pap" do couro

 const K=PK[kind]||PK.limb,v=(Math.pow(p,.65)*.8+.08)*gv,bo=K.bo,br=.8+.45*p;   // br: golpe forte = mais brilho

 // 1) contato: 2-3 estalos colados (couro + pele): impulso pré-gravado + rajada de ruído
 const nb=p>.4?3:2;let tk=t;for(let k=0;k<nb;k++){aClk(o,tk,v*(1.1-.28*k),r*br*(1-.1*k),K.sl*r*(1-.12*k),.8);aN1(o,tk,.008+.012*p,'w','bandpass',K.sl*r*(1-.15*k)*br,.8,v*(.55-.15*k),.0003);tk+=rnd2(.002,.006)}
 aN1(o,t,.006,'w','highpass',5200,.7,v*.2*(.4+p),.0003);                                                // brilho do couro
 // 2) carne: mid que desce rápido
 aN1(o,t+.002,.045+.07*p,'p','bandpass',K.fl*r*(1+.3*p),.9,v*2,.0007,K.fl*.4);
 // 3) corpo: "whomp" = ruído grave com corte descendo + baque tonal
 aN1(o,t,.08+.12*p*bo,'b','lowpass',K.lo*r*3.2,.9,v*(1.1+.9*bo),.0015,K.lo*r*.55);

 // 4) modos ressonantes do alvo (crânio / caixa torácica / membro): tons que tocam e morrem, mais longos nos golpes fortes
 for(const m of K.md)aMode(o,t+rnd2(0,.002),m[0]*r,m[1]*(.7+.6*p),v*m[2]*(.6+.7*p),1.06);
 // 5) ar da luva (espuma comprimindo) + farfalhar do couro/pele acomodando
 aN1(o,t,.035,'b','lowpass',700,.7,v*.5,.002,250);aN1(o,t+.012,.05+.04*p,'w','highpass',1800,.6,v*.14,.004);

//  - velocidade da mão: medida de verdade pelo rastreio do controle (h.pk, pico dos últimos .15 s, teto 16 m/s)

// Passos: a cabeça sobe e desce a cada passada; cada vale (cabeça mais baixa) = 1 passo. Sem esse sobe-e-desce NÃO há corrida (só mexer os braços não anda).
// Ritmo (passos/s) define a velocidade; braços balançando em oposição liberam a velocidade cheia (sem braços fica em ~60%, ajustável em Testes > config).
const RUN={ok:false,base:0,bob:0,hi:0,lo:0,dir:1,tLo:0,tStep:-9,ints:[],cad:0,amp:.04,v:0,A:0,alt:0,m0:0,m1:0,hx:0,hz:-1,

const RUN_T=[[1.3,1.2],[1.8,2.4],[2.4,4.2],[3,6],[3.6,7.5],[4.4,9]];   // passos/s -> m/s
function runReset(){RUN.ok=false;RUN.v=0;RUN.cad=0;RUN.ints.length=0;RUN.tStep=-9;RUN.A=0;RUN.alt=0;RUN.m0=RUN.m1=0;RUN.hv=false}

function runTick(dt){
 const y=cam.position.y,AMP=Math.max(.008,.014/CFG.rs),H=Math.min(.006,AMP*.5);
 if(!RUN.ok){RUN.ok=true;RUN.base=y;RUN.bob=0;RUN.hi=0;RUN.lo=0;RUN.dir=1;RUN.hv=false;return 0}
 RUN.base+=(y-RUN.base)*(1-Math.exp(-dt/.5));                      // tira agachar/levantar (movimento lento)
 RUN.bob+=((y-RUN.base)-RUN.bob)*(1-Math.exp(-dt/.035));          // tira tremor
 const b=RUN.bob;
 if(RUN.dir>0){if(b>RUN.hi)RUN.hi=b;else if(RUN.hi-b>H){RUN.dir=-1;RUN.lo=b;RUN.tLo=FT}}
 else{if(b<RUN.lo){RUN.lo=b;RUN.tLo=FT}
  else if(b-RUN.lo>H){const amp=RUN.hi-RUN.lo;RUN.dir=1;RUN.hi=b;
   if(amp>=AMP){const d=RUN.tLo-RUN.tStep;
    if(d>=.95)RUN.ints.length=0;                                    // recomeço depois de parar
    else if(d>.2){RUN.ints.push(d);if(RUN.ints.length>4)RUN.ints.shift()}
    if(d>.2){RUN.tStep=RUN.tLo;RUN.amp+=(amp-RUN.amp)*.5}}}}        // d<=.2 s = detecção dupla, ignora
 // braços (posição da mão relativa à cabeça)
 const g0=hands[0]&&hands[0].g,g1=hands[1]&&hands[1].g;
 if(g0&&g1){const t=RUN.tmp;
  t.copy(g0.position).sub(cam.position);if(RUN.hv)RUN.vL.copy(t).sub(RUN.pL).divideScalar(dt);RUN.pL.copy(t);
  t.copy(g1.position).sub(cam.position);if(RUN.hv)RUN.vR.copy(t).sub(RUN.pR).divideScalar(dt);RUN.pR.copy(t);
  if(RUN.hv){const k=1-Math.exp(-dt/.15),m0=RUN.vL.length(),m1=RUN.vR.length();RUN.m0+=(m0-RUN.m0)*k;RUN.m1+=(m1-RUN.m1)*k;RUN.A=(RUN.m0+RUN.m1)/2;
   if(m0>.3&&m1>.3){const ca=-RUN.vL.dot(RUN.vR)/(m0*m1);RUN.alt+=(-ca-RUN.alt)*(1-Math.exp(-dt/.3))}}   // alt: -1 = braços em oposição, +1 = juntos
  RUN.hv=true}
 // ritmo -> velocidade
 let tg=0;const age=FT-RUN.tStep,n=RUN.ints.length;
 if(n){const sr=RUN.ints.slice().sort((p,q)=>p-q),med=sr[sr.length>>1];
  if(age>Math.max(.55,med*1.6)){RUN.ints.length=0;RUN.cad=0}
  else{RUN.cad=1/med;const conf=n>=2?1:.7;
   const act=cl((RUN.A-.45)/1.1,0,1),altF=cl(.8-.4*RUN.alt,.5,1),armF=1-(CFG.rb/100)*(1-act*altF),ampF=cl(.8+RUN.amp/.05*.3,.8,1.2);
   tg=Math.min(CFG.rv,runTab(RUN.cad)*conf*armF*ampF)}}
 RUN.v+=(tg-RUN.v)*(1-Math.exp(-dt/(tg>RUN.v?.3:.14)));           // acelera suave, para rápido
 if(RUN.v<.05&&tg==0)RUN.v=0;
