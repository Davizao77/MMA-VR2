function main(){
$('msg').textContent='';
const cl=(v,a=-1,b=1)=>Math.max(a,Math.min(b,v));
let MODE='menu',ARENA='oct',MS='main',crowdE=0;
const DBG={m:'',t:-99},dbg=m=>{DBG.m=m;DBG.t=performance.now()/1000};   // registro do último evento (aparece no HUD sobre o inimigo por 40 s)
const GR_G=1,GR_E=2,GR_H=4,GR_B=8,GR_I=16;
// ---------- Física ----------
const cfg=new A.btDefaultCollisionConfiguration(),W=new A.btDiscreteDynamicsWorld(new A.btCollisionDispatcher(cfg),new A.btDbvtBroadphase(),new A.btSequentialImpulseConstraintSolver(),cfg);

try{W.getSolverInfo().set_m_numIterations(40)}catch(e){}
const tv2=new A.btVector3(),tv=new A.btVector3(),tt=new A.btTransform(),tq=new A.btQuaternion(0,0,0,1);
const setV=(x,y,z)=>{tv.setValue(x,y,z);return tv};
const F=(p,x,y,z)=>p.b.applyCentralForce(setV(x,y,z)),T=(p,x,y,z)=>p.b.applyTorque(setV(x,y,z));
function body(sh,m,x,y,z,g,k,kin,rot){
  tt.setIdentity();tt.setOrigin(setV(x,y,z));if(rot){tq.setValue(0,Math.sin(rot/2),0,Math.cos(rot/2));tt.setRotation(tq)}
  const ms=new A.btDefaultMotionState(tt),I=new A.btVector3(0,0,0);if(m)sh.calculateLocalInertia(m,I);
  const b=new A.btRigidBody(new A.btRigidBodyConstructionInfo(m,ms,sh,I));
  if(kin){b.setCollisionFlags(2);b.setActivationState(4)}else if(m){b.setActivationState(4);b.setDamping(.05,.85)}
  b.setFriction(1);b.setRestitution(0);W.addRigidBody(b,g,k);return b}
const box=(x,y,z,hx,hy,hz,rot)=>body(new A.btBoxShape(new A.btVector3(hx,hy,hz)),0,x,y,z,GR_G,GR_E|GR_I,false,rot);
box(0,-.5,0,12,.5,12);
for(let i=0;i<8;i++){const a=i*Math.PI/4;box(Math.sin(a)*3.55,1.5,Math.cos(a)*3.55,1.5,1.5,.15,a)}
// ---- escala do cômodo (VR): o jogador anda de verdade, então o inimigo fica preso num círculo de ROOM_R metros em volta do ponto de origem ----
const ROOM_R=1.6;   // raio do cômodo em metros (aumente se o seu espaço for maior)
let VRON=false,roomOn=false;const roomW=[];
{const N=16,rr=ROOM_R+.15,hx=rr*Math.tan(Math.PI/N)+.1;
 for(let i=0;i<N;i++){const a=i*2*Math.PI/N,b=body(new A.btBoxShape(new A.btVector3(hx,1.5,.15)),0,Math.sin(a)*rr,1.5,Math.cos(a)*rr,GR_G,GR_E|GR_I,false,a);W.removeRigidBody(b);roomW.push(b)}}
function roomWalls(on){if(on===roomOn)return;roomOn=on;for(const b of roomW){if(on)W.addRigidBody(b,GR_G,GR_E|GR_I);else W.removeRigidBody(b)}}

// ---------- Cena ----------
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.xr.enabled=true;document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07070c);scene.fog=new THREE.Fog(0x07070c,6,18);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,200),rig=new THREE.Group();rig.add(cam);scene.add(rig);
const fl=new THREE.Mesh(new THREE.SphereGeometry(.4,8,8),new THREE.MeshBasicMaterial({color:0xff0000,transparent:true,opacity:0,side:THREE.BackSide,depthTest:false}));fl.renderOrder=99;cam.add(fl);
const hemi=new THREE.HemisphereLight(0xffffff,0x222233,.55);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(2,6,3);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:12});scene.add(sun);const fill=new THREE.DirectionalLight(0xffd9c0,.4);fill.position.set(-3,2,4);scene.add(fill);
// chão
const _o0=scene.children.length;
const cv=document.createElement('canvas');cv.width=cv.height=512;let c=cv.getContext('2d');
c.fillStyle='#14307a';c.fillRect(0,0,512,512);c.strokeStyle='#fff';c.lineWidth=8;c.beginPath();c.arc(256,256,230,0,7);c.stroke();
c.fillStyle='#ffffffcc';c.font='bold 70px sans-serif';c.textAlign='center';c.fillText('MMAVR2',256,280);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3.7,8),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cv),roughness:.8}));floor.rotation.x=-Math.PI/2;floor.rotation.z=Math.PI/8;floor.receiveShadow=true;scene.add(floor);
const out=new THREE.Mesh(new THREE.CircleGeometry(14,32),new THREE.MeshStandardMaterial({color:0x101015}));out.rotation.x=-Math.PI/2;out.position.y=-.01;scene.add(out);
// grade
const fc=document.createElement('canvas');fc.width=fc.height=32;c=fc.getContext('2d');c.strokeStyle='#bbb';c.lineWidth=2;c.beginPath();c.moveTo(0,0);c.lineTo(32,32);c.moveTo(32,0);c.lineTo(0,32);c.stroke();
const ft=new THREE.CanvasTexture(fc);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(14,10);
const fm=new THREE.MeshBasicMaterial({map:ft,transparent:true,side:THREE.DoubleSide,opacity:.55,depthWrite:false});
for(let i=0;i<8;i++){const a=i*Math.PI/4,m=new THREE.Mesh(new THREE.PlaneGeometry(2.84,2),fm);m.position.set(Math.sin(a)*3.4,1,Math.cos(a)*3.4);m.rotation.y=a;scene.add(m);
 const p=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,2.1),new THREE.MeshStandardMaterial({color:0x222}));const b=a+Math.PI/8;p.position.set(Math.sin(b)*3.68,1.05,Math.cos(b)*3.68);scene.add(p)}
const octG=new THREE.Group();scene.children.slice(_o0).forEach(o=>octG.add(o));scene.add(octG);

// ---------- Utilitários de malha ----------
const nc=document.createElement('canvas');nc.width=nc.height=128;{const g=nc.getContext('2d');g.fillStyle='#c98f68';g.fillRect(0,0,128,128);for(let i=0;i<3000;i++){g.fillStyle='rgba('+(Math.random()<.5?'120,60,40':'255,225,200')+','+Math.random()*.08+')';g.fillRect(Math.random()*128,Math.random()*128,2,2)}}
const stex=new THREE.CanvasTexture(nc);stex.wrapS=stex.wrapT=THREE.RepeatWrapping;
const M=(c,r,e)=>new THREE.MeshStandardMaterial({color:c,roughness:r,emissive:e||0});
const skin=new THREE.MeshStandardMaterial({map:stex,roughness:.55,emissive:0x1c0904}),shorts=M(0x1d3fd0,.7),glove=M(0xd01818,.4),dark=M(0x2a1a12,.9),white=M(0xeeeeee,.7),lipM=M(0x9b4a46,.5),eyeM=M(0xf4f0ea,.3),irisM=M(0x3a2514,.3);
const sp=new THREE.SphereGeometry(1,20,14);
function ell(x,y,z,mat){const m=new THREE.Mesh(sp,mat);m.scale.set(x,y,z);m.castShadow=true;return m}
const at=(par,m,x,y,z,rz)=>{m.position.set(x,y,z);if(rz)m.rotation.z=rz;par.add(m);return m};
// ---------- Luvas de MMA (realistas, acolchoadas, com brilho) ----------
const makeGlove=(()=>{
 // ambiente procedural (softboxes) só pra gerar reflexos brilhantes no couro
 let env=null;
 try{const es=new THREE.Scene();es.background=new THREE.Color(0x15171d);
  const pan=(c,i,x,y,z,w,h)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);es.add(m)};
  pan(0xffffff,2.6,0,5,0,8,8);pan(0xfff0dc,1.6,4,2,3,5,5);pan(0xd2e2ff,1.3,-4,1.5,-3,5,5);pan(0xffffff,1.1,0,.8,-5,10,3);pan(0xffe6cc,.8,-3,.5,4,5,3);pan(0x30303a,.6,0,-4,0,8,8);
  const pm=new THREE.PMREMGenerator(R);env=pm.fromScene(es,.12).texture;pm.dispose()}catch(e){env=null}
 // textura do couro: mosqueado suave só na cor (sem bump de alta frequência, que causava o brilho granulado)
 const gc=document.createElement('canvas');gc.width=gc.height=256;{const g=gc.getContext('2d');g.fillStyle='#f2f2f2';g.fillRect(0,0,256,256);
  for(let i=0;i<220;i++){const x=Math.random()*256,y=Math.random()*256,r=8+Math.random()*22,k=Math.random()<.65?0:255,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+k+','+k+','+k+',.06)');gr.addColorStop(1,'rgba('+k+','+k+','+k+',0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}}
 const grainT=new THREE.CanvasTexture(gc);grainT.wrapS=grainT.wrapT=THREE.RepeatWrapping;
 // pontilhado da costura
 const sc=document.createElement('canvas');sc.width=64;sc.height=8;{const g=sc.getContext('2d');g.fillStyle='#16110f';g.fillRect(0,0,64,8);g.fillStyle='#f1e9d6';g.fillRect(6,1,36,6)}
 const stT=new THREE.CanvasTexture(sc);stT.wrapS=stT.wrapT=THREE.RepeatWrapping;stT.repeat.set(30,1);
 // logo na costas da luva
 const lc=document.createElement('canvas');lc.width=256;lc.height=128;{const g=lc.getContext('2d');
  g.fillStyle='#101014';g.fillRect(0,0,256,128);g.fillStyle='#f4f4f4';g.fillRect(0,0,256,10);g.fillRect(0,118,256,10);
  g.fillStyle='#e8c14a';g.font='bold 62px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('MMA',128,52);
  g.fillStyle='#ffffff';g.font='bold 30px sans-serif';g.fillText('FIGHT GEAR',128,98)}
 const logoT=new THREE.CanvasTexture(lc);logoT.anisotropy=4;
 // fita de velcro
 const vc=document.createElement('canvas');vc.width=vc.height=64;{const g=vc.getContext('2d');g.fillStyle='#d9d9d9';g.fillRect(0,0,64,64);for(let i=0;i<500;i++){g.fillStyle='rgba(90,90,90,'+Math.random()*.25+')';g.fillRect(Math.random()*64,Math.random()*64,2,2)}}
 const velT=new THREE.CanvasTexture(vc);
 const mats={
  fabric:new THREE.MeshStandardMaterial({color:0x121216,roughness:.85,metalness:0}),
  strap:new THREE.MeshStandardMaterial({color:0x1d1d23,roughness:.8,metalness:0,envMap:env,envMapIntensity:.3}),
  velcro:new THREE.MeshStandardMaterial({color:0xffffff,map:velT,roughness:.95}),
  stitch:new THREE.MeshStandardMaterial({color:0xffffff,map:stT,roughness:.8}),
  logo:new THREE.MeshStandardMaterial({color:0xffffff,map:logoT,roughness:.55,metalness:0,envMap:env,envMapIntensity:.4,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2})};
 const leather=new Map();
 const leatherMat=c=>{if(!leather.has(c))leather.set(c,new THREE.MeshPhysicalMaterial({color:c,map:grainT,roughness:.55,metalness:0,clearcoat:.25,clearcoatRoughness:.45,reflectivity:.3,envMap:env,envMapIntensity:.55}));return leather.get(c)};
 // superelipsoide ("almofada"): formato de acolchoado arredondado
 const pillow=(n,ws,hs)=>{const g=new THREE.SphereGeometry(1,ws||22,hs||16),p=g.attributes.position,nr=g.attributes.normal,e=n-1;
  for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i),z=p.getZ(i);const k=Math.pow(Math.pow(Math.abs(x),n)+Math.pow(Math.abs(y),n)+Math.pow(Math.abs(z),n),1/n)||1;x/=k;y/=k;z/=k;p.setXYZ(i,x,y,z);
   const nx=Math.sign(x)*Math.pow(Math.abs(x),e),ny=Math.sign(y)*Math.pow(Math.abs(y),e),nz=Math.sign(z)*Math.pow(Math.abs(z),e),l=Math.hypot(nx,ny,nz)||1;nr.setXYZ(i,nx/l,ny/l,nz/l)}
  return g};
 const PIL=pillow(3.2),PIL2=pillow(2.6),SPH=new THREE.SphereGeometry(1,14,10),SPH2=new THREE.SphereGeometry(1,18,13),CYL=new THREE.CylinderGeometry(1,1,1,20,1,false);
 const tq=new THREE.Quaternion(),te=new THREE.Euler(),tm=new THREE.Matrix4(),tp=new THREE.Vector3(),ts=new THREE.Vector3();
 const put=(list,geo,x,y,z,sx,sy,sz,rx,ry,rz)=>{te.set(rx||0,ry||0,rz||0);tq.setFromEuler(te);tm.compose(tp.set(x,y,z),tq,ts.set(sx,sy,sz));const g=geo.clone();g.applyMatrix4(tm);list.push(g)};
 const merge=list=>{const pos=[],nor=[],uv=[],idx=[];let off=0;
  for(const g of list){const p=g.attributes.position,n=g.attributes.normal,u=g.attributes.uv;
   for(let i=0;i<p.count;i++){pos.push(p.getX(i),p.getY(i),p.getZ(i));nor.push(n.getX(i),n.getY(i),n.getZ(i));uv.push(u?u.getX(i):0,u?u.getY(i):0)}
   if(g.index){for(let i=0;i<g.index.count;i++)idx.push(g.index.getX(i)+off)}else for(let i=0;i<p.count;i++)idx.push(i+off);
   off+=p.count;g.dispose()}
  const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));m.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));m.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));m.setIndex(idx);return m};
 // costura que acompanha o contorno da almofada
 const seam=(a,b,y,n,r)=>{const pts=[];for(let i=0;i<48;i++){const t=i/48*Math.PI*2,c=Math.cos(t),s=Math.sin(t);pts.push(new THREE.Vector3(a*Math.sign(c)*Math.pow(Math.abs(c),2/n),y,b*Math.sign(s)*Math.pow(Math.abs(s),2/n)))}
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,true),96,r,5,true)};
 const hex=(c,k)=>{const o=new THREE.Color(c);return o.multiplyScalar(k)};
 // sm = lado do modelo (palma virada pra -sm no eixo X, polegar em +Z, punho em +Y, nós dos dedos em -Y)
 return function(sm,color){color=color||0xc41212;
  const L=[],S=[],F=[],T=[],V=[],ST=[],g=new THREE.Group();
  // --- couro: almofada do dorso + rolo curto sobre os nós (só a base dos dedos) ---
  put(L,PIL,sm*.006,-.010,0,.043,.064,.057);
  put(L,PIL2,sm*.016,-.058,0,.027,.022,.058);
  // protetor lateral do dedo mínimo (osso do mindinho)
  put(L,PIL2,sm*.004,-.040,-.047,.034,.045,.014);
  // --- dedos expostos: 3 falanges em pele, curvadas no punho fechado ---
  const zs=[.0345,.0115,-.0115,-.0345],sc=[1,1.06,1,.84];
  for(let i=0;i<4;i++){const z=zs[i],k=sc[i],hm=.0265*k;
   put(S,SPH2,-sm*.016,-.080,z,.031,.0125,.0118);            // proximal (sai de baixo do rolo)
   put(S,SPH2,-sm*.043,-.083,z,.0125,.0125,.0120);           // junta (nó do meio)
   put(S,SPH2,-sm*.047,-.083+hm,z,.0115,hm,.0112);           // média
   put(S,SPH2,-sm*.041,-.083+2*hm+.005,z,.0105,.0125,.0105); // ponta
  }
  // --- polegar exposto: base acolchoada em couro, o resto em pele cruzando os dedos ---
  put(L,PIL2,-sm*.034,-.004,.040,.019,.030,.016,0,0,-sm*.25);
  put(S,SPH2,-sm*.054,-.030,.044,.014,.018,.016);
  put(S,SPH2,-sm*.066,-.052,.024,.0125,.0125,.028);
  put(S,SPH2,-sm*.066,-.052,-.012,.0115,.0115,.0205);
  put(S,SPH2,-sm*.066,-.052,-.030,.0105,.0105,.0105);
  // --- punho: cuff preto + tira de velcro + aba clara + pestana ---
  put(F,CYL,sm*.002,.082,0,.042,.036,.046);
  put(T,CYL,sm*.002,.086,0,.0455,.030,.0495);
  put(V,new THREE.BoxGeometry(1,1,1),sm*.002,.086,.0495,.034,.030,.003);
  put(L,PIL2,sm*.002,.058,0,.041,.011,.047);
  // --- logo (na costa da luva) ---
  const logo=new THREE.Mesh(new THREE.PlaneGeometry(.052,.026),mats.logo);logo.position.set(sm*.0495,-.012,0);logo.rotation.y=sm*Math.PI/2;g.add(logo);
  // --- costuras ---
  put(ST,seam(.0272,.0578,-.058,2.6,.0014),sm*.016,0,0,1,1,1);
  put(ST,seam(.0415,.0475,.0675,2.6,.0014),sm*.002,0,0,1,1,1);
  const add=(list,mat,sh)=>{if(!list.length)return;const m=new THREE.Mesh(merge(list),mat);m.castShadow=!!sh;g.add(m);return m};
  add(L,leatherMat(color),true);add(S,skin,true);add(F,mats.fabric);add(T,mats.strap,true);add(V,mats.velcro);add(ST,mats.stitch);
  return g}
})();

// orienta a luva do jogador: nós dos dedos apontam na direção ombro→mão, polegar pra cima, palma pra dentro
const glX=new THREE.Vector3(),glY=new THREE.Vector3(),glZ=new THREE.Vector3(),glS=new THREE.Vector3(),glM=new THREE.Matrix4(),glQ=new THREE.Quaternion();
function orientGlove(h,eye,fw,dt){
 glS.set(eye.x-fw.z*h.s*.19,eye.y-.22,eye.z+fw.x*h.s*.19);
 glY.copy(h.pos).sub(glS);if(glY.lengthSq()<1e-6)return;glY.normalize().negate();
 glZ.set(0,1,0).addScaledVector(fw,.5);glZ.addScaledVector(glY,-glZ.dot(glY));if(glZ.lengthSq()<1e-6)glZ.set(0,0,1);glZ.normalize();
 glX.crossVectors(glY,glZ);glM.makeBasis(glX,glY,glZ);glQ.setFromRotationMatrix(glM);
 h.mesh.quaternion.slerp(glQ,1-Math.exp(-dt*28))}
